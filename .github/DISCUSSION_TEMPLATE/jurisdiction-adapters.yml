name: Jurisdiction Adapters / 法域适配器
description: Discuss a bounded jurisdiction-specific drafting adapter without treating it as legal advice. / 讨论受限的法域撰写适配器，不构成法律意见。
title: "jurisdiction adapter / 法域适配器: "
body:
  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction and patent type / 法域与专利类型
    validations:
      required: true
  - type: textarea
    id: public_authority
    attributes:
      label: Public authority / 公开依据
      description: Link official public guidance or explain the authoritative source. / 链接官方公开指引，或说明权威来源。
    validations:
      required: true
  - type: textarea
    id: adapter_boundary
    attributes:
      label: Proposed adapter boundary / 拟议适配边界
      description: Separate deterministic checks from issues requiring qualified counsel. / 区分确定性检查与必须由专业人士判断的事项。
    validations:
      required: true
